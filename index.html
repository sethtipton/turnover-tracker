<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rental Flip Checklist</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.5;
        color: #1f2933;
        background: #f5f6f8;
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      body {
        margin: 0;
        padding: 28px;
      }

      main {
        max-width: 1040px;
        margin: 0 auto;
      }

      .top-bar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(260px, 360px) auto;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 22px;
      }

      .top-bar .mode-toggle {
        justify-self: end;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 2rem;
      }

      h2 {
        margin: 0 0 14px;
        font-size: 1.2rem;
      }

      .intro {
        margin: 0;
        color: #52606d;
      }

      .mode-toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 42px;
        padding: 7px 10px;
        border: 1px solid #d8dee6;
        border-radius: 6px;
        background: #ffffff;
        white-space: nowrap;
        cursor: pointer;
      }

      .mode-toggle input {
        width: 18px;
        height: 18px;
        margin: 0;
        accent-color: #2563eb;
      }

      .unit-panel {
        display: grid;
        grid-template-columns: minmax(180px, 0.35fr) minmax(0, 1fr);
        gap: 12px;
        align-items: end;
      }

      .unit-summary {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 12px;
        align-items: center;
        min-height: 42px;
        color: #52606d;
        font-size: 0.9rem;
      }

      .unit-summary strong {
        color: #1f2933;
      }

      .unit-summary span + span::before {
        content: "";
        display: inline-block;
        width: 4px;
        height: 4px;
        margin-right: 10px;
        border-radius: 999px;
        background: #cbd5e1;
        vertical-align: middle;
      }

      .panel {
        margin-bottom: 14px;
        padding: 14px;
        border: 1px solid #d8dee6;
        border-radius: 8px;
        background: #ffffff;
      }

      details.panel {
        padding: 0;
      }

      .panel-summary {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: start;
        gap: 8px;
        list-style: none;
        min-height: 48px;
        padding: 11px 14px;
        border-radius: 8px;
        cursor: pointer;
      }

      .panel-summary::marker,
      .room-summary::marker,
      .material-summary::marker {
        content: "";
      }

      .panel-summary::-webkit-details-marker,
      .room-summary::-webkit-details-marker,
      .material-summary::-webkit-details-marker {
        display: none;
      }

      .panel-summary::before,
      .room-summary::before,
      .material-summary::before {
        content: "";
        width: 9px;
        height: 9px;
        border-right: 2px solid #52606d;
        border-bottom: 2px solid #52606d;
        transform: rotate(-45deg);
        transform-origin: 50% 50%;
        transition: transform 150ms ease;
      }

      .panel-summary::before {
        align-self: center;
      }

      .material-summary::before {
        align-self: center;
      }

      .room-summary::before {
        align-self: start;
        margin-top: 0.74em;
      }

      details.panel[open] > .panel-summary::before,
      .room-group[open] > .room-summary::before,
      .material-section[open] > .material-summary::before {
        transform: translateY(-3px) rotate(45deg);
      }

      .panel-summary:hover {
        background: #f5f8fc;
      }

      .panel-summary:focus-visible {
        outline: 3px solid #93c5fd;
        outline-offset: 2px;
      }

      .panel-summary h2 {
        display: inline;
        margin: 0;
        font-size: 1.2rem;
      }

      .tasks-summary-content {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .page-voice-input {
        display: grid;
        gap: 8px;
        min-width: 0;
      }

      .page-voice-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
      }

      .page-voice-title {
        margin: 0;
        color: #374151;
        font-size: 0.9rem;
        font-weight: 700;
        text-align: right;
      }

      .page-voice-button {
        background: #0f766e;
      }

      .page-voice-button:hover {
        background: #115e59;
      }

      .page-voice-button.danger {
        background: #dc2626;
      }

      .page-voice-button.danger:hover {
        background: #b91c1c;
      }

      .page-voice-status {
        margin: 0;
        color: #52606d;
        font-size: 0.84rem;
        text-align: right;
      }

      .panel-body {
        padding: 0 14px 14px;
      }

      .secondary-panel-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-items: start;
        column-gap: 12px;
        row-gap: 10px;
        margin-bottom: 14px;
      }

      .secondary-panel-grid > .panel {
        margin-bottom: 0;
        border: 0;
        background: transparent;
      }

      .secondary-panel-grid > .panel > .panel-summary {
        height: 100%;
        border: 1px solid #d8dee6;
        border-radius: 8px;
        background: #ffffff;
      }

      #materials-panel {
        grid-column: 1;
        grid-row: 1;
      }

      #filters-panel {
        grid-column: 2;
        grid-row: 1;
      }

      .secondary-panel-body {
        grid-column: 1 / -1;
        grid-row: 2;
        margin-bottom: 0;
        padding: 12px;
        border: 1px solid #d8dee6;
        border-radius: 8px;
        background: #ffffff;
      }

      .dashboard-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 12px;
        align-items: center;
      }

      .materials-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-items: start;
        gap: 12px;
      }

      .dashboard-metric {
        display: inline-flex;
        min-height: 34px;
        align-items: baseline;
        gap: 6px;
        color: #52606d;
        font-size: 0.9rem;
      }

      .material-section {
        overflow: hidden;
        border: 1px solid #e1e7ef;
        border-radius: 8px;
        background: #fbfcfd;
      }

      .dashboard-metric + .dashboard-metric::before {
        content: "";
        width: 4px;
        height: 4px;
        margin-right: 4px;
        border-radius: 999px;
        background: #cbd5e1;
      }

      .dashboard-value {
        color: #1f2933;
        font-size: 1rem;
        font-weight: 700;
      }

      .dashboard-detail {
        color: #2563eb;
        font-size: 0.86rem;
        font-weight: 700;
      }

      .work-log-list {
        display: grid;
        gap: 6px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .work-log-item {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: baseline;
        gap: 10px;
        padding: 6px 0;
        border-bottom: 1px solid #edf1f5;
      }

      .work-log-item:last-child {
        border-bottom: 0;
      }

      .work-log-text {
        overflow: hidden;
        color: #1f2933;
        font-size: 0.92rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .work-log-meta,
      .work-log-empty {
        margin: 0;
        color: #64748b;
        font-size: 0.82rem;
      }

      .filter-grid,
      .search-grid,
      .fixed-category-add-form,
      .room-add-form {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: end;
      }

      .filter-grid {
        grid-template-columns: repeat(6, minmax(0, 1fr)) auto;
      }

      .search-grid {
        grid-template-columns: minmax(0, 1fr) auto;
      }

      .room-add-form {
        grid-template-columns: minmax(140px, 0.35fr) minmax(0, 1fr) minmax(180px, 0.45fr) auto;
      }

      .field {
        min-width: 0;
      }

      label {
        display: block;
        margin-bottom: 4px;
        color: #52606d;
        font-size: 0.86rem;
        font-weight: 700;
      }

      input[type="text"],
      input[type="search"],
      input[type="file"],
      textarea,
      select {
        width: 100%;
        min-height: 42px;
        padding: 9px 10px;
        border: 1px solid #b8c2cc;
        border-radius: 6px;
        background: #ffffff;
        color: #1f2933;
        font-size: 1rem;
      }

      textarea {
        min-height: 70px;
        resize: vertical;
      }

      button {
        min-height: 42px;
        border: 0;
        border-radius: 6px;
        padding: 9px 14px;
        color: #ffffff;
        background: #2563eb;
        font-size: 0.95rem;
        cursor: pointer;
      }

      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible,
      button:focus-visible {
        outline: 3px solid #93c5fd;
        outline-offset: 2px;
      }

      input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: #2563eb;
      }

      input[type="file"] {
        padding: 8px;
        cursor: pointer;
      }

      input[type="search"] {
        min-height: 52px;
        font-size: 1.08rem;
      }

      button:hover {
        background: #1d4ed8;
      }

      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      button:disabled:hover {
        background: #2563eb;
      }

      button.secondary {
        background: #4b5563;
      }

      button.secondary:hover {
        background: #374151;
      }

      button.danger {
        background: #dc2626;
      }

      button.danger:hover {
        background: #b91c1c;
      }

      button.light {
        background: #e5e7eb;
        color: #111827;
      }

      button.light:hover {
        background: #d1d5db;
      }

      button.light:disabled:hover {
        background: #e5e7eb;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .task-actions {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid #e1e7ef;
      }

      .tasks-panel .work-log-panel {
        margin: 12px 0 0;
      }

      .task-actions-title {
        margin: 0 0 8px;
        color: #52606d;
        font-size: 0.9rem;
        font-weight: 700;
      }

      .task-actions-main {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 8px;
      }

      .danger-actions {
        margin: 0;
      }

      .danger-actions summary {
        display: inline-flex;
        min-height: 42px;
        align-items: center;
        padding: 8px 12px;
        border-radius: 6px;
        background: #fee2e2;
        color: #991b1b;
        font-size: 0.9rem;
        font-weight: 700;
        list-style: none;
        cursor: pointer;
      }

      .danger-actions summary::marker {
        content: "";
      }

      .danger-actions summary::-webkit-details-marker {
        display: none;
      }

      .danger-actions summary:hover {
        background: #fecaca;
      }

      .danger-actions-body {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
      }

      .status {
        min-height: 24px;
        margin: 0 0 12px;
        color: #52606d;
      }

      .search-panel {
        margin-bottom: 14px;
        padding-bottom: 14px;
        border-bottom: 1px solid #e1e7ef;
        background: #ffffff;
      }

      .search-icon-button,
      .search-close-button {
        display: inline-grid;
        width: 42px;
        min-height: 42px;
        place-items: center;
        padding: 0;
      }

      .search-icon-button::before {
        content: "";
        grid-area: 1 / 1;
        width: 14px;
        height: 14px;
        border: 2px solid currentColor;
        border-radius: 50%;
      }

      .search-icon-button::after {
        content: "";
        grid-area: 1 / 1;
        width: 9px;
        height: 2px;
        margin: 14px 0 0 16px;
        border-radius: 999px;
        background: currentColor;
        transform: rotate(45deg);
      }

      .search-close-button {
        background: #e5e7eb;
        color: #111827;
      }

      .search-close-button:hover {
        background: #d1d5db;
      }

      .search-grid {
        grid-template-columns: minmax(0, 1fr) auto auto;
        align-items: start;
      }

      .search-panel button {
        min-height: 52px;
      }

      .tasks-panel[open] .search-panel {
        position: sticky;
        top: 0;
        z-index: 5;
        padding-top: 10px;
        box-shadow: 0 8px 16px rgb(255 255 255 / 90%);
      }

      .search-panel label {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      .room-group {
        margin-bottom: 12px;
        border: 1px solid #d8dee6;
        border-radius: 8px;
        background: #ffffff;
      }

      .room-summary {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: start;
        column-gap: 8px;
        list-style: none;
        min-height: 48px;
        padding: 9px 12px;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }

      .room-summary:hover {
        background: #f5f8fc;
      }

      .room-summary:focus-visible {
        outline: 3px solid #93c5fd;
        outline-offset: 2px;
      }

      .room-count {
        color: #52606d;
        font-size: 0.84rem;
        font-weight: 400;
      }

      .room-count.complete {
        color: #047857;
        font-weight: 700;
      }

      .room-summary-content {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .room-name {
        min-width: 0;
        border-radius: 4px;
        overflow-wrap: anywhere;
      }

      .room-edit-button {
        position: relative;
        display: inline-grid;
        width: 36px;
        min-height: 36px;
        place-items: center;
        padding: 0;
        background: #e5e7eb;
        color: #374151;
      }

      .room-edit-button::before {
        content: "";
        position: absolute;
        width: 12px;
        height: 4px;
        border-radius: 999px;
        background: currentColor;
        transform: translate(-1px, 1px) rotate(-42deg);
      }

      .room-edit-button::after {
        content: "";
        position: absolute;
        width: 0;
        height: 0;
        margin: -8px 0 0 10px;
        border-top: 3px solid transparent;
        border-bottom: 3px solid transparent;
        border-left: 5px solid currentColor;
        transform: rotate(-42deg);
      }

      .room-edit-button:hover {
        background: #d1d5db;
      }

      .room-edit-button:focus-visible {
        outline: 3px solid #93c5fd;
        outline-offset: 2px;
      }

      .room-name-input {
        min-height: 34px;
        padding: 4px 8px;
        font: inherit;
        font-weight: 700;
      }

      .room-progress {
        grid-column: 1 / -1;
        width: 100%;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        border: 0;
        accent-color: #2563eb;
        background: #e5e7eb;
      }

      .room-progress::-webkit-progress-bar {
        border-radius: 999px;
        background: #e5e7eb;
      }

      .room-progress::-webkit-progress-value {
        border-radius: 999px;
        background: #2563eb;
      }

      .room-progress::-moz-progress-bar {
        border-radius: 999px;
        background: #2563eb;
      }

      .room-group[open] .room-summary {
        border-bottom: 1px solid #d8dee6;
        border-bottom-right-radius: 0;
        border-bottom-left-radius: 0;
      }

      .task-list {
        display: grid;
        gap: 6px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .empty-room {
        margin: 0;
        padding: 12px 12px 0;
        color: #52606d;
      }

      .room-task-section {
        padding: 10px;
      }

      .material-summary {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto auto;
        align-items: center;
        gap: 6px;
        list-style: none;
        min-height: 46px;
        padding: 9px 10px;
        cursor: pointer;
      }

      .material-summary:hover {
        background: #f5f8fc;
      }

      .material-summary:focus-visible {
        outline: 3px solid #93c5fd;
        outline-offset: -3px;
      }

      .material-title {
        margin: 0;
        font-size: 0.96rem;
      }

      .material-count {
        color: #52606d;
        font-size: 0.86rem;
        font-weight: 700;
        white-space: nowrap;
      }

      .material-done-toggle {
        min-height: 42px;
        padding: 7px 10px;
        font-size: 0.84rem;
        white-space: nowrap;
      }

      .material-body {
        padding: 0 10px 10px;
      }

      .material-section[open] > .material-summary {
        border-bottom: 1px solid #e1e7ef;
      }

      .task {
        --swipe-x: 0px;
        --category-accent: #64748b;
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        padding: 10px;
        border: 1px solid #e1e7ef;
        border-radius: 6px;
        background: #fbfcfd;
        transform: translateX(var(--swipe-x));
        transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
      }

      .task + .task::after {
        content: "";
        position: absolute;
        top: -5px;
        right: 12px;
        left: 12px;
        height: 1px;
        background: #e5e7eb;
        background: color-mix(in srgb, var(--category-accent) 18%, #e5e7eb);
        opacity: 0.8;
        pointer-events: none;
      }

      .task::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 4px;
        border-top-left-radius: 6px;
        border-bottom-left-radius: 6px;
        background: var(--category-accent);
      }

      .task[draggable="true"] {
        touch-action: pan-y;
      }

      .task.swiping {
        background: #eff6ff;
        border-color: #93c5fd;
      }

      .task.swipe-ready {
        background: #d1fae5;
        border-color: #047857;
      }

      .task.dragging {
        opacity: 0.55;
      }

      .task.drag-over {
        border-color: #2563eb;
        box-shadow: inset 0 3px 0 #2563eb;
      }

      .task.drag-over.drag-after {
        box-shadow: inset 0 -3px 0 #2563eb;
      }

      .task-check {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: center;
        gap: 10px;
        min-width: 0;
        cursor: pointer;
      }

      .task-main {
        min-width: 0;
      }

      .task-text {
        overflow-wrap: anywhere;
      }

      .task-text-line {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .task-note-icon {
        display: inline-grid;
        width: 18px;
        height: 18px;
        place-items: center;
        flex: 0 0 auto;
        border: 1px solid #b8c2cc;
        border-radius: 50%;
        color: #52606d;
        font-size: 0.75rem;
        font-weight: 700;
        line-height: 1;
      }

      .task-note {
        margin-top: 4px;
        color: #52606d;
        font-size: 0.92rem;
        overflow-wrap: anywhere;
      }

      .status-badge {
        display: inline-flex;
        align-items: center;
        min-height: 22px;
        padding: 2px 7px;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 700;
        white-space: nowrap;
      }

      .status-pending-review {
        background: #fef3c7;
        color: #92400e;
      }

      .status-approved {
        background: #dbeafe;
        color: #1e40af;
      }

      .status-done {
        background: #d1fae5;
        color: #047857;
      }

      .task.done .task-text {
        color: #7b8794;
        text-decoration: line-through;
      }

      .task.done .task-note {
        color: #9aa5b1;
      }

      .task-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .drag-handle {
        cursor: grab;
        user-select: none;
      }

      .drag-handle:active {
        cursor: grabbing;
      }

      .edit-form {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        padding-top: 10px;
        border-top: 1px solid #e1e7ef;
      }

      .edit-form .field:nth-child(3),
      .edit-form .field:nth-child(4),
      .edit-form .field:nth-child(5),
      .edit-form .photo-field {
        grid-column: 1 / -1;
      }

      .review-list {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .review-task {
        display: grid;
        gap: 8px;
        padding: 12px;
        border: 1px solid #f59e0b;
        border-radius: 6px;
        background: #fffbeb;
      }

      .review-toolbar {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 12px;
      }

      .review-header,
      .review-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      .review-header {
        justify-content: space-between;
      }

      .review-meta {
        color: #52606d;
        font-size: 0.88rem;
        font-weight: 700;
      }

      .review-title {
        font-weight: 700;
        overflow-wrap: anywhere;
      }

      .field-hint {
        margin-top: 4px;
        color: #52606d;
        font-size: 0.86rem;
      }

      .photo-list {
        grid-column: 1 / -1;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .photo-item {
        position: relative;
        width: 88px;
      }

      .photo-thumb-button {
        display: block;
        width: 88px;
        height: 88px;
        min-height: 0;
        padding: 0;
        overflow: hidden;
        border: 1px solid #b8c2cc;
        border-radius: 6px;
        background: #ffffff;
      }

      .photo-thumb-button:hover {
        background: #ffffff;
        border-color: #2563eb;
      }

      .photo-thumb {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .photo-remove {
        width: 100%;
        min-height: 30px;
        margin-top: 4px;
        padding: 4px 6px;
        background: #e5e7eb;
        color: #111827;
        font-size: 0.78rem;
      }

      .photo-remove:hover {
        background: #d1d5db;
      }

      .voice-note-list {
        grid-column: 1 / -1;
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .page-voice-recordings {
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .voice-note-item,
      .page-voice-recording {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        align-items: start;
        gap: 8px;
        padding: 8px;
        border: 1px solid #e1e7ef;
        border-radius: 6px;
        background: #ffffff;
      }

      .voice-note-item audio {
        width: 100%;
        min-width: 180px;
        max-width: 100%;
      }

      .page-voice-recording audio {
        width: 100%;
        max-width: 100%;
      }

      .voice-note-label {
        grid-column: 1 / -1;
        color: #52606d;
        font-size: 0.84rem;
      }

      .voice-note-remove {
        width: fit-content;
        min-height: 36px;
        padding: 6px 10px;
        background: #fee2e2;
        color: #991b1b;
        font-size: 0.84rem;
      }

      .voice-note-remove:hover {
        background: #fecaca;
      }

      .task-context-menu {
        position: fixed;
        z-index: 20;
        display: grid;
        gap: 8px;
        width: min(280px, calc(100vw - 24px));
        padding: 10px;
        border: 1px solid #b8c2cc;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 16px 36px rgb(15 23 42 / 18%);
      }

      .context-menu-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .context-menu-title {
        color: #374151;
        font-size: 0.88rem;
        font-weight: 700;
      }

      .context-close {
        display: inline-grid;
        width: 34px;
        min-height: 34px;
        place-items: center;
        padding: 0;
        background: #e5e7eb;
        color: #111827;
        font-size: 1.1rem;
        line-height: 1;
      }

      .context-close:hover {
        background: #d1d5db;
      }

      .task-context-menu button:not(.context-close),
      .task-context-menu select {
        width: 100%;
      }

      .context-move-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
      }

      .photo-preview-dialog {
        width: min(92vw, 820px);
        padding: 0;
        border: 0;
        border-radius: 8px;
        background: #ffffff;
      }

      .photo-preview-dialog::backdrop {
        background: rgb(17 24 39 / 70%);
      }

      .photo-preview-content {
        padding: 12px;
      }

      .photo-preview-image {
        display: block;
        width: 100%;
        max-height: 76vh;
        object-fit: contain;
        background: #111827;
      }

      .photo-preview-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding-top: 10px;
      }

      .photo-preview-caption {
        min-width: 0;
        color: #52606d;
        overflow-wrap: anywhere;
      }

      .fixed-category-add-form,
      .room-add-form,
      .quick-add-form {
        margin-top: 10px;
        padding-top: 12px;
        border-top: 1px solid #e1e7ef;
      }

      .quick-add-form input {
        border-style: dashed;
        background: #ffffff;
      }

      .add-control {
        margin-top: 10px;
      }

      .add-control summary {
        list-style: none;
      }

      .add-control summary::marker {
        content: "";
      }

      .add-control summary::-webkit-details-marker {
        display: none;
      }

      .add-toggle {
        display: block;
        width: 100%;
        min-height: 42px;
        padding: 9px 14px;
        border-radius: 6px;
        background: #e5e7eb;
        color: #111827;
        text-align: center;
        cursor: pointer;
      }

      .add-toggle:hover {
        background: #d1d5db;
      }

      .add-toggle:focus-visible {
        outline: 3px solid #93c5fd;
        outline-offset: 2px;
      }

      /* Work Mode contract:
         - only the Tasks panel stays visible
         - done tasks are removed in app.js
         - notes/photos/audio, edit controls, and progress bars are hidden
         - quick add and add item controls intentionally remain visible */
      body:has(#work-mode-toggle:checked) .panel:not(:has(#tasks-title)),
      body:has(#work-mode-toggle:checked) .task-note,
      body:has(#work-mode-toggle:checked) .photo-list,
      body:has(#work-mode-toggle:checked) .voice-note-list,
      body:has(#work-mode-toggle:checked) .task-buttons,
      body:has(#work-mode-toggle:checked) .edit-form,
      body:has(#work-mode-toggle:checked) .task-actions,
      body:has(#work-mode-toggle:checked) .room-progress {
        display: none;
      }

      body:has(#work-mode-toggle:checked) .task {
        grid-template-columns: minmax(0, 1fr);
        padding: 8px 10px;
      }

      body:has(#work-mode-toggle:checked) .task-list {
        gap: 4px;
      }

      body:has(#work-mode-toggle:checked) .task + .task::after {
        top: -3px;
        right: 10px;
        left: 10px;
        opacity: 0.68;
      }

      @media (max-width: 760px) {
        body {
          padding: 16px;
        }

        .top-bar {
          grid-template-columns: 1fr;
        }

        .page-voice-controls {
          justify-content: stretch;
        }

        .page-voice-title,
        .page-voice-status {
          text-align: left;
        }

        .top-bar .mode-toggle,
        .mode-toggle,
        .page-voice-button,
        #page-voice-create {
          width: 100%;
        }

        .dashboard-grid,
        .unit-panel,
        .secondary-panel-grid,
        .materials-grid,
        .filter-grid,
        .edit-form,
        .fixed-category-add-form,
        .room-add-form {
          grid-template-columns: 1fr;
        }

        #materials-panel,
        #filters-panel,
        .secondary-panel-body {
          grid-column: 1;
          grid-row: auto;
        }

        #materials-panel {
          grid-row: 1;
        }

        #filters-panel {
          grid-row: 2;
        }

        .secondary-panel-grid:has(#materials-panel[open]) #materials-panel-body {
          grid-row: 2;
        }

        .secondary-panel-grid:has(#materials-panel[open]) #filters-panel {
          grid-row: 3;
        }

        .secondary-panel-grid:has(#filters-panel[open]) #filters-panel-body {
          grid-row: 3;
        }

        .search-grid {
          grid-template-columns: minmax(0, 1fr) auto;
        }

        .search-grid .field {
          grid-column: 1 / -1;
        }

        .material-summary {
          grid-template-columns: auto minmax(0, 1fr) auto;
        }

        .material-done-toggle {
          grid-column: 2 / -1;
          justify-self: end;
        }

        .task {
          grid-template-columns: minmax(0, 1fr);
        }

        .task-buttons {
          grid-column: 1 / -1;
        }

        .drag-handle {
          flex: 1 1 100px;
        }

        .task-text-line,
        .review-header {
          align-items: flex-start;
          flex-direction: column;
        }

        .review-actions button {
          flex: 1 1 100px;
        }

        .photo-item,
        .photo-thumb-button {
          width: 76px;
        }

        .photo-thumb-button {
          height: 76px;
        }

        .photo-preview-footer {
          align-items: stretch;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main id="app-shell">
      <div class="top-bar">
        <div>
          <h1>Rental Flip Checklist</h1>
          <p class="intro">Track materials and work tasks by room, category, and completion status.</p>
        </div>
        <section class="page-voice-input" aria-labelledby="page-voice-title">
          <div class="page-voice-controls">
            <button id="page-voice-record" class="page-voice-button" type="button">Record voice</button>
            <button id="page-voice-create" class="light" type="button" data-action="create-tasks-from-voice" disabled>Create tasks</button>
          </div>
          <p id="page-voice-status" class="page-voice-status" aria-live="polite"></p>
          <ul id="page-voice-recordings" class="page-voice-recordings" aria-label="Voice input recordings" hidden></ul>
        </section>
        <label class="mode-toggle" for="work-mode-toggle">
          <input id="work-mode-toggle" type="checkbox">
          <span>Work Mode</span>
        </label>
      </div>

      <section class="panel unit-panel" aria-labelledby="unit-title">
        <div class="field">
          <label id="unit-title" for="unit-select">Unit</label>
          <select id="unit-select" name="unit-select"></select>
        </div>
        <div id="unit-summary" class="unit-summary" aria-live="polite"></div>
      </section>

      <details class="panel dashboard-panel" open>
        <summary class="panel-summary">
          <h2 id="dashboard-title">Dashboard</h2>
        </summary>
        <div class="panel-body">
          <div id="dashboard" class="dashboard-grid" aria-label="Dashboard metrics"></div>
        </div>
      </details>

      <section id="review-queue-panel" class="panel" aria-labelledby="review-queue-title" hidden>
        <h2 id="review-queue-title">Review Queue</h2>
        <div class="review-toolbar">
          <button id="bulk-approve-review" type="button">Approve All</button>
        </div>
        <ul id="review-queue-list" class="review-list"></ul>
      </section>

      <div class="secondary-panel-grid">
        <details id="materials-panel" class="panel">
          <summary class="panel-summary">
            <h2 id="materials-title">Materials</h2>
          </summary>
        </details>

        <details id="filters-panel" class="panel">
          <summary class="panel-summary">
            <h2 id="filters-title">Filters</h2>
          </summary>
        </details>

        <div id="materials-panel-body" class="panel-body secondary-panel-body" hidden>
          <div class="materials-grid">
            <div id="shopping-list"></div>
            <div id="materials-on-hand"></div>
          </div>
        </div>

        <div id="filters-panel-body" class="panel-body secondary-panel-body" hidden>
          <div class="filter-grid">
            <div class="field">
              <label for="room-filter">Room</label>
              <select id="room-filter" name="room-filter"></select>
            </div>
            <div class="field">
              <label for="category-filter">Category</label>
              <select id="category-filter" name="category-filter"></select>
            </div>
            <div class="field">
              <label for="status-filter">Status</label>
              <select id="status-filter" name="status-filter">
              </select>
            </div>
            <div class="field">
              <label for="material-type-filter">Materials</label>
              <select id="material-type-filter" name="material-type-filter"></select>
            </div>
            <div class="field">
              <label for="photo-filter">Photos</label>
              <select id="photo-filter" name="photo-filter"></select>
            </div>
            <div class="field">
              <label for="note-filter">Notes</label>
              <select id="note-filter" name="note-filter"></select>
            </div>
            <button id="clear-filters-inline" class="light" type="button">Clear</button>
          </div>
        </div>
      </div>

      <details class="panel tasks-panel">
        <summary class="panel-summary">
          <span class="tasks-summary-content">
            <h2 id="tasks-title">Tasks</h2>
            <button id="show-task-search" class="light search-icon-button" type="button" aria-label="Show task search" aria-controls="task-search-panel" aria-expanded="false"></button>
          </span>
        </summary>
        <div class="panel-body">
          <search id="task-search-panel" class="search-panel" aria-label="Search tasks" hidden>
            <div class="search-grid">
              <div class="field">
                <label for="task-search">Search tasks</label>
                <input id="task-search" name="task-search" type="search" placeholder="Search tasks..." autocomplete="off">
              </div>
              <button id="clear-filters" class="light" type="button">Clear Filters</button>
              <button id="hide-task-search" class="search-close-button" type="button" aria-label="Close task search">X</button>
            </div>
          </search>
          <p id="status" class="status" aria-live="polite"></p>
          <div id="task-groups" aria-label="Tasks grouped by room"></div>
          <section id="task-actions" class="task-actions" aria-labelledby="task-actions-title" hidden>
            <h3 id="task-actions-title" class="task-actions-title">Task Actions</h3>
            <div class="task-actions-main">
              <button id="mark-open" class="secondary" type="button">Mark open done</button>
              <button id="delete-done" class="secondary" type="button">Delete completed</button>
              <details class="danger-actions">
                <summary>Danger</summary>
                <div class="danger-actions-body">
                  <button id="clear-all" class="danger" type="button">Delete all tasks</button>
                </div>
              </details>
            </div>
          </section>
          <details class="panel work-log-panel">
            <summary class="panel-summary">
              <h2 id="work-log-title">Work Log</h2>
            </summary>
            <div class="panel-body">
              <div id="work-log" aria-labelledby="work-log-title"></div>
            </div>
          </details>
        </div>
      </details>
    </main>

    <dialog id="photo-preview-dialog" class="photo-preview-dialog" aria-labelledby="photo-preview-caption">
      <form class="photo-preview-content" method="dialog">
        <img id="photo-preview-image" class="photo-preview-image" alt="" width="800" height="600">
        <div class="photo-preview-footer">
          <div id="photo-preview-caption" class="photo-preview-caption"></div>
          <button class="light" type="submit">Close</button>
        </div>
      </form>
    </dialog>

    <div id="task-context-menu" class="task-context-menu" hidden>
      <div class="context-menu-header">
        <span class="context-menu-title">Task actions</span>
        <button class="context-close" type="button" data-context-action="close" aria-label="Close task actions">X</button>
      </div>
      <button type="button" data-context-action="edit">Edit</button>
      <button type="button" data-context-action="duplicate">Duplicate</button>
      <button class="danger" type="button" data-context-action="delete">Delete</button>
      <div class="context-move-row">
        <select id="context-move-room" aria-label="Move task to room"></select>
        <button id="context-move-button" class="secondary" type="button">Move</button>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
